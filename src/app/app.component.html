<div class="main-container">

    <div class="button-holder container-border">
        <div class="icon-holder">
            <button class="link-button content-border" routerLink="/daily" routerLinkActive="active"><span>D</span></button>
            <button class="link-button content-border" routerLink="/endless" routerLinkActive="active"><span>E</span></button>
            <button class="link-button content-border" routerLink="/items" routerLinkActive="active"><span>I</span></button>
            <button class="link-button content-border" routerLink="/config" routerLinkActive="active"><span>C</span></button>
        </div>
        <button class="display-button content-border"> {{currentRouteName}} </button>
    </div>

    <div class="content-wrapper">
        <router-outlet></router-outlet>
        <div *ngIf="toRevealDetails" id="absolute-details" class="container-border">
            <span> TLDR </span>

            <span>
                Placeholder text. Explain the game here.
            </span>

            <span>
                Placeholder text. Link to the project page here.
            </span>
        </div>
    </div>

    <footer>
        <div class="version-text-container">
            <span>Version 0.0.1</span>
        </div>

        <div class="details-container">
            <span class="signature-text">
                Made by Artem Rozh
            </span>

            <button id="hint-button" class="content-border" (click)="revealDetails()">?</button>
        </div>
    </footer>
</div>
